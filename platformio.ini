; ============================================================================
;  AI-Powered Smart Neonatal Monitoring System
;  PlatformIO Project Configuration
;
;  Target : Espressif ESP32 DevKit v1
;  Author : Academic prototype (proof-of-concept)
; ============================================================================

[platformio]
name = neonatal-monitoring-system
description = ESP32-based neonatal vitals, cry and movement monitoring prototype
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -D SERIAL_BAUD_RATE=115200
    -D CORE_DEBUG_LEVEL=1
    -Wall

; ---------------------------------------------------------------------------
;  External libraries
;
;  MAX30102 ....... SparkFun MAX3010x driver + Maxim SpO2/HR reference algorithm
;  DS18B20 ........ OneWire + DallasTemperature
;  MPU6050 ........ Adafruit MPU6050 (depends on Adafruit Unified Sensor)
;  SH1106 OLED .... Adafruit SH110X + Adafruit GFX
; ---------------------------------------------------------------------------
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SH110X @ ^2.1.11

lib_ldf_mode = deep+
